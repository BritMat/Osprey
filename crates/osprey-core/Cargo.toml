[package]
name = "osprey-core"
description = "Download engine for BM Osprey: segmented downloads, HLS assembly and ffmpeg merging"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
tokio.workspace = true
reqwest.workspace = true
futures.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
hex = "0.4"
regex = "1"
adblock = { version = "0.13.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
lol_html = "3.0.3"
html2text = "0.17.4"
dirs = "7.0.0"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }
base64 = "0.23.1"
percent-encoding = "2"
hickory-resolver = { version = "0.26.3", features = ["https-ring", "tokio", "webpki-roots"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
