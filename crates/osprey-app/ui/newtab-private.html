<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Private tab</title>
<style>
  :root { color-scheme: dark; --bg: rgb(10,8,20); --text: rgb(234,242,255); --muted: rgb(147,164,196); --faint: rgb(93,110,144); --field: rgba(0,0,0,.35); --accent: rgb(167,139,250); }
  html, body { margin: 0; height: 100%; color: var(--text); font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", "SF Pro Text", -apple-system, "Cantarell", "Ubuntu", sans-serif;
    background: radial-gradient(900px 500px at 15% -10%, rgba(167,139,250,.16), transparent 60%), radial-gradient(700px 500px at 110% 110%, rgba(124,242,154,.08), transparent 60%), var(--bg); }
  main { min-height: 100%; display: grid; place-content: center; gap: 26px; padding: 24px; box-sizing: border-box; }
  h1 { margin: 0; display: flex; align-items: center; gap: 18px; font: 700 clamp(40px, 7vw, 72px)/1 "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif; letter-spacing: -.03em; }
  h1 span { color: var(--accent); }
  .mark { width: clamp(52px, 8vw, 84px); height: auto; border-radius: 22%; box-shadow: 0 10px 30px -8px rgba(0,0,0,.6); flex: none; }
  form { display: flex; width: min(620px, 86vw); }
  input { flex: 1; height: 52px; padding: 0 22px; border-radius: 26px; border: 0; background: var(--field); color: var(--text); font: inherit; font-size: 16px; outline: 0;
    box-shadow: inset 0 1px 3px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.06); }
  input:focus { box-shadow: inset 0 1px 3px rgba(0,0,0,.6), 0 0 0 2px var(--accent); }
  .note { color: var(--muted); max-width: 620px; font-size: 13.5px; margin: 0; }
  .note b { color: var(--accent); font-weight: 600; }
  .keys { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--faint); font-size: 12.5px; }
  kbd { font: 600 11px/1 "Cascadia Mono", Consolas, monospace; border: 1px solid rgba(255,255,255,.16); border-bottom-width: 2px; border-radius: 5px; padding: 3px 6px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1><svg class="mark" viewBox="0 0 1024 1024" aria-hidden="true"><rect width="1024" height="1024" rx="230" fill="rgb(11,23,48)"/><path fill="rgb(154,245,230)" d="M512 600C420 520 300 410 132 262c64-4 126 8 186 34-34-38-54-74-64-110 122 76 216 180 258 284zM512 600c92-80 212-190 380-338-64-4-126 8-186 34 34-38 54-74 64-110-122 76-216 180-258 284z"/><path fill="rgb(234,255,251)" d="M512 250c88 130 98 290 48 410-12 30-30 46-48 52-18-6-36-22-48-52-50-120-40-280 48-410z"/><path fill="rgb(255,181,71)" d="M476 676c22-8 50-8 72 0-8 40-20 76-36 114-16-38-28-74-36-114z"/><path d="M300 880h424" stroke="rgb(34,227,196)" stroke-width="46" stroke-linecap="round"/></svg><span>BM</span>&nbsp;Osprey</h1>
  <!-- No script and no hash sign on purpose. Tauri applies the app's
       security policy to this data: page and writes it back unescaped,
       so a hash sign would cut the page short. The address bar above
       takes web addresses. This box searches. -->
  <form action="https://duckduckgo.com/" method="get">
    <input name="q" autofocus placeholder="Search privately with DuckDuckGo" spellcheck="false" autocomplete="off">
  </form>
  <p class="note"><b>Private tab.</b> Cookies, history and site data from this tab are gone when you close it, and WebRTC, camera and microphone are off so it cannot leak your real address. Downloads you save stay on disk.</p>
  <div class="keys">
    <span><kbd>Ctrl</kbd> <kbd>L</kbd> address bar</span>
    <span><kbd>Ctrl</kbd> <kbd>Shift</kbd> <kbd>N</kbd> another private tab</span>
    <span><kbd>Ctrl</kbd> <kbd>W</kbd> close tab</span>
  </div>
</main>
</body>
</html>
