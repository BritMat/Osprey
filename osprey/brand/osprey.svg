<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16305c"/>
      <stop offset="0.55" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#060b18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.86" r="0.6">
      <stop offset="0" stop-color="#22e3c4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22e3c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#9af5e6"/>
      <stop offset="1" stop-color="#22e3c4"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ff9d2e"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#glow)"/>
  <rect x="6" y="6" width="1012" height="1012" rx="224" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="4"/>
  <rect width="1024" height="520" rx="230" fill="url(#sheen)"/>
  <g filter="url(#soft)">
    <!-- wings: a diving bird, which also reads as a download arrow -->
    <path fill="url(#wing)" d="M512 600 C 420 520 300 410 132 262 C 196 258 258 270 318 296 C 284 258 264 222 254 186 C 376 262 470 366 512 470 Z"/>
    <path fill="url(#wing)" d="M512 600 C 604 520 724 410 892 262 C 828 258 766 270 706 296 C 740 258 760 222 770 186 C 648 262 554 366 512 470 Z"/>
    <!-- tail, body and head -->
    <path fill="#eafffb" d="M512 250 C 600 380 610 540 560 660 C 548 690 530 706 512 712 C 494 706 476 690 464 660 C 414 540 424 380 512 250 Z"/>
    <!-- the osprey's dark eye stripe -->
    <path fill="#0b1730" d="M452 598 C 486 620 538 620 572 598 C 568 622 562 644 554 662 C 528 650 496 650 470 662 C 462 644 456 622 452 598 Z"/>
    <!-- beak -->
    <path fill="url(#body)" d="M476 676 C 498 668 526 668 548 676 C 540 716 528 752 512 790 C 496 752 484 716 476 676 Z"/>
  </g>
  <!-- water line: the tray of the download arrow -->
  <path d="M300 880 H 724" stroke="#22e3c4" stroke-width="46" stroke-linecap="round"/>
  <path d="M388 880 H 636" stroke="#ffffff" stroke-opacity="0.55" stroke-width="12" stroke-linecap="round"/>
